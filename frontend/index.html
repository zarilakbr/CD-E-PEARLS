<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#FBF8F3" />
    <title>CD'E Pearls Lombok | Haute Joaillerie Samudera Indonesia</title>
    <meta name="description" content="Platform resmi perhiasan mutiara air laut asli Lombok (South Sea Pearls Grade AAA) berbalut Emas 18K solid dengan sertifikat gemologi resmi, studio atelier 3D, dan pemesanan WhatsApp dinamis." />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('cde_theme') || 'system';
          var isDark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.setAttribute('data-theme', 'dark');
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.setAttribute('data-theme', 'light');
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
          var l = localStorage.getItem('cde_language') || 'id';
          root.setAttribute('lang', l);
        } catch(e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FBF8F3] text-[#12263A] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
