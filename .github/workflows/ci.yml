name: Continuous Integration

on:
  push:
    branches:
      - main
      - 'tahap-*'
  pull_request:
    branches:
      - main
      - 'tahap-*'

jobs:
  backend:
    name: Backend Tests (PHP 8.4 & Pest)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: cde_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, gd, exif
          coverage: none

      - name: Copy Testing Environment
        run: cp .env.example .env

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate Application Key
        run: php artisan key:generate --env=testing

      - name: Run Database Migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: cde_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan migrate --force

      - name: Execute Pest Test Suite
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: cde_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: ./vendor/bin/pest --testdox

  frontend:
    name: Frontend Verification (Vitest, TSC, Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install NPM Dependencies
        run: npm install

      - name: Run TypeScript Verification
        run: npx tsc --noEmit

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Run Production Build
        run: npm run build

